networks:
  docker-net:
    name: docker-net
    external: true

services:
  phpmailer:
    image: php:8.5-apache
    ports:
      - "80:80"
    networks:
      - docker-net
    volumes:
      - ./smtp:/var/www/html
      - ./000-default.conf:/etc/apache2/sites-enabled/000-default.conf

  mailpit:
    image: axllent/mailpit:latest
    networks:
      - docker-net
    ports:
      - "8025:8025"
